name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make test
      - name: Run short crash campaign
        run: make crash-test CRASH_ROUNDS=30
      - name: Run benchmark smoke test
        run: make benchmark

  java:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build engine library
        run: make shared
      - name: Test Spring Boot service
        run: cd server && mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build service image
        run: docker build -t lsm-tree-server .
      - name: Smoke-test the running container
        run: bash scripts/smoke_test.sh lsm-tree-server
