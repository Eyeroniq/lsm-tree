spring.application.name=lsm-tree-server

# Engine data and tuning (see LsmProperties). LSM_DATA_DIR etc. override these.
lsm.data-dir=data
lsm.memtable-bytes=65536
lsm.bloom-bits-per-key=10
lsm.compaction-trigger=4
lsm.sync-writes=true

management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
