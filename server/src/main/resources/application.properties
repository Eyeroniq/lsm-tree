spring.application.name=lsm-tree-server

# Engine data and tuning (see LsmProperties). LSM_DATA_DIR etc. override these.
lsm.data-dir=data
lsm.memtable-bytes=65536
lsm.bloom-bits-per-key=10
lsm.compaction-trigger=4
lsm.sync-writes=true

# Values are raw request bodies. Without this, a PUT sent as
# application/x-www-form-urlencoded (curl's default for -d) would have its
# body consumed as form parameters and store an empty value.
spring.mvc.formcontent.filter.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
