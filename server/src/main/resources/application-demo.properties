# Demo profile (`make demo`): tiny memtables, tables and levels, so a few
# thousand writes visibly flush and push data down several levels on the
# dashboard. Not a tuning to run real workloads with.
lsm.data-dir=demo-data
lsm.memtable-bytes=8192
lsm.compaction-trigger=3
lsm.table-bytes=8192
lsm.level1-bytes=16384
